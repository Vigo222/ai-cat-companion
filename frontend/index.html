<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冯二喵的房间</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #2b2530; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
    #game { display: flex; justify-content: center; align-items: center; height: 100vh; }

    #login {
      position: fixed; inset: 0; background: linear-gradient(160deg, #ffe9d6, #ffd6e0);
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; z-index: 20;
    }
    #login h1 { color: #7a5c49; font-size: 32px; }
    #login p { color: #a08573; }
    #login input {
      padding: 12px 18px; border: 2px solid #e8b89b; border-radius: 14px; font-size: 16px;
      outline: none; width: 240px; text-align: center; background: #fffaf5;
    }
    .who { display: flex; gap: 16px; }
    .who button {
      padding: 12px 28px; border: none; border-radius: 14px; font-size: 17px; cursor: pointer;
      background: #fff; color: #7a5c49; box-shadow: 0 3px 0 #e8b89b; transition: transform .1s;
    }
    .who button:hover { transform: translateY(-2px); }
    .who button.sel { background: #ff9f7a; color: #fff; box-shadow: 0 3px 0 #d97c58; }
    #enterBtn { padding: 12px 48px; border: none; border-radius: 16px; font-size: 18px; cursor: pointer;
      background: #7ac9a2; color: #fff; box-shadow: 0 3px 0 #58a880; }
    #loginErr { color: #d9534f; height: 20px; font-size: 14px; }

    #chatBar {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      width: min(560px, 86vw); display: none; gap: 10px; z-index: 10;
    }
    #chatBar.show { display: flex; }
    #chatInput {
      flex: 1; padding: 13px 20px; border: 2px solid rgba(217, 189, 160, .8); border-radius: 26px;
      outline: none; font-size: 15px; color: #5c4a3d;
      background: rgba(255, 253, 247, .92); backdrop-filter: blur(6px);
      box-shadow: 0 4px 18px rgba(122, 92, 73, .25); transition: border-color .15s;
    }
    #chatInput:focus { border-color: #ffb78f; }
    #chatInput::placeholder { color: #c4ab93; }
    #sendBtn {
      padding: 0 24px; border: none; border-radius: 26px; cursor: pointer; font-size: 15px;
      background: #ffb78f; color: #fff; box-shadow: 0 4px 14px rgba(217, 124, 88, .4);
      transition: transform .1s;
    }
    #sendBtn:hover { transform: translateY(-2px); }
    #sendBtn:disabled { opacity: .6; cursor: default; transform: none; }
    #actionBar {
      position: fixed; right: 26px; bottom: 92px; display: none; flex-direction: column; gap: 10px; z-index: 10;
      align-items: flex-end;
    }
    #actionBar.show { display: flex; }
    #petStats {
      width: 208px; padding: 12px 14px; border-radius: 20px;
      background: rgba(255, 253, 247, .9); color: #7a5c49; box-shadow: 0 4px 14px rgba(122, 92, 73, .22);
      backdrop-filter: blur(6px); font-size: 13px;
    }
    .stat { display: grid; grid-template-columns: 42px 1fr 34px; align-items: center; gap: 7px; }
    .stat + .stat { margin-top: 8px; }
    .statTrack { height: 9px; border-radius: 99px; background: rgba(217, 189, 160, .35); overflow: hidden; }
    .statFill { height: 100%; width: 50%; border-radius: inherit; transition: width .25s ease; }
    #hungerFill { background: linear-gradient(90deg, #ffbf6b, #ff8f70); }
    #cleanFill { background: linear-gradient(90deg, #9fd8ff, #6db2f0); }
    #moodFill { background: linear-gradient(90deg, #7ac9a2, #8fb7ff); }
    #petMeta { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    #ybValue { color: #d99a2b; font-weight: bold; }
    #illnessTag { color: #d9534f; font-weight: bold; }
    .barBtn {
      padding: 12px 18px; border: none; border-radius: 22px; cursor: pointer; font-size: 15px;
      background: rgba(255, 253, 247, .94); color: #7a5c49; box-shadow: 0 4px 14px rgba(122, 92, 73, .25);
      transition: transform .1s, background .15s;
    }
    .barBtn:hover { transform: translateY(-2px); background: #fff6df; }
    .barBtn:disabled { opacity: .65; cursor: default; transform: none; }
    .panel {
      position: fixed; right: 26px; bottom: 92px; width: 250px; max-height: 60vh; overflow-y: auto;
      padding: 14px; border-radius: 20px; z-index: 11; display: none;
      background: rgba(255, 253, 247, .96); color: #7a5c49; box-shadow: 0 6px 22px rgba(122, 92, 73, .3);
      backdrop-filter: blur(6px); font-size: 13px;
    }
    .panel.show { display: block; }
    .panel h3 { font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .panel h3 .close { cursor: pointer; color: #c4ab93; }
    .itemRow {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 7px 6px; border-radius: 10px;
    }
    .itemRow:hover { background: rgba(255, 214, 224, .35); }
    .itemRow .info { flex: 1; }
    .itemRow .info small { color: #b39a82; display: block; }
    .itemRow button {
      padding: 5px 12px; border: none; border-radius: 12px; cursor: pointer; font-size: 12px;
      background: #ffb78f; color: #fff;
    }
    .itemRow button:disabled { opacity: .5; cursor: default; }
    .empty { color: #b39a82; text-align: center; padding: 12px 0; }

    /* 玩家说的话：从输入条上方飘起并淡出 */
    #floatMsg {
      position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%);
      max-width: 70vw; padding: 9px 18px; border-radius: 20px; font-size: 14px;
      background: rgba(122, 201, 162, .95); color: #fff; z-index: 9;
      opacity: 0; pointer-events: none; white-space: pre-wrap;
      box-shadow: 0 4px 14px rgba(88, 168, 128, .4);
    }
    #floatMsg.fly { animation: flyUp 2.6s ease-out forwards; }
    @keyframes flyUp {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      12% { opacity: 1; transform: translate(-50%, 0); }
      75% { opacity: 1; transform: translate(-50%, -34px); }
      100% { opacity: 0; transform: translate(-50%, -56px); }
    }
  </style>
</head>
<body>
  <div id="login">
    <h1>🐾 冯二喵的房间</h1>
    <p>输入口令，选择你是谁</p>
    <input id="codeInput" type="password" placeholder="口令" />
    <div class="who">
      <button data-who="冯二狗">我是 冯二狗</button>
      <button data-who="汝道">我是 汝道</button>
    </div>
    <div id="loginErr"></div>
    <button id="enterBtn">进入房间</button>
  </div>

  <div id="game"></div>

  <div id="floatMsg"></div>
  <div id="actionBar">
    <div id="petStats">
      <div class="stat"><span>饱腹</span><div class="statTrack"><div id="hungerFill" class="statFill"></div></div><b id="hungerValue">80</b></div>
      <div class="stat"><span>清洁</span><div class="statTrack"><div id="cleanFill" class="statFill"></div></div><b id="cleanValue">80</b></div>
      <div class="stat"><span>心情</span><div class="statTrack"><div id="moodFill" class="statFill"></div></div><b id="moodValue">75</b></div>
      <div id="petMeta"><span>🪙 <b id="ybValue">0</b> 元宝</span><span id="illnessTag"></span></div>
    </div>
    <button id="bagBtn" class="barBtn">🎒 背包</button>
    <button id="shopBtn" class="barBtn">🛒 商店</button>
  </div>
  <div id="bagPanel" class="panel"><h3>🎒 背包 <span class="close" data-close="bagPanel">✕</span></h3><div id="bagList"></div></div>
  <div id="shopPanel" class="panel"><h3>🛒 商店 <span class="close" data-close="shopPanel">✕</span></h3><div id="shopList"></div></div>
  <div id="chatBar">
    <input id="chatInput" placeholder="和冯二喵说点什么…" />
    <button id="sendBtn">🐾 发送</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
